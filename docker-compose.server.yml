# Production stack for apps.athenadecisions.com.
# Ports: backend 8050, frontend 3050 (distinct from golden-path 8020/3020,
# xcape 8030/3030, advent 8040/3040); and the resident
# Medley's screen 8052 (watch) and 8053 (control).  Those are on 127.0.0.1: nginx is the way in.
# One port is open to the Internet: 3333, the house's NetHub, where Medleys connect to play
# over Courier (backend/hearts/courier.py).  It is XNS in TCP, which nginx's web server can't carry.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8050}:8000"
      - "${NETHUB_PORT:-3333}:3333"
    environment:
      ENVIRONMENT: production
      HEARTS_DB: /data/db/hearts.db
      HEARTS_ADMIN_PASSWORD: ${HEARTS_ADMIN_PASSWORD:-}
      HEARTS_NETHUB_PORT: "3333"
      HEARTS_OFFER_KEY: ${HEARTS_OFFER_KEY:-}     # Who may offer players to everyone: the resident.
    volumes:
      - hearts-db:/data/db          # players + games database (SQLite)
    networks:
      - hearts-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        # Path-based under apps.athenadecisions.com/hearts.
        VITE_BASE_PATH: ${HEARTS_BASE_PATH:-/hearts/}
        VITE_API_BASE: ${HEARTS_API_BASE:-/hearts/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3050}:80"
    depends_on:
      - backend
    networks:
      - hearts-network

  # The resident Medley (docker/resident.lisp): offers an Expert, the neural network and a
  # Conservative to the house, over Courier on the house's NetHub; they play on this Medley.
  # Its screen: watch on 8052 (public), control on 8053 (nginx login).  No secrets in here but
  # the offer key: whoever controls it has a Lisp that can run shell commands.
  medley:
    build:
      context: ./docker
      target: resident
    image: hearts-resident
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MEDLEY_NETHUB: ${MEDLEY_NETHUB:-backend:3333:10-00-AA-00-00-10}
      RESIDENTKEY: ${HEARTS_OFFER_KEY:-}
      RESIDENTPLAYERS: ${RESIDENT_PLAYERS:-EP NP CP}
    ports:
      - "127.0.0.1:${MEDLEY_WATCH_PORT:-8052}:6080"
      - "127.0.0.1:${MEDLEY_CONTROL_PORT:-8053}:6081"
    volumes:
      - ./dist:/hearts/dist:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    networks:
      - hearts-network

volumes:
  hearts-db:

networks:
  hearts-network:
    driver: bridge
