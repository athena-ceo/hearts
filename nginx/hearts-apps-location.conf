# HEARTS -- path-based serving under https://apps.athenadecisions.com/hearts
#
# HOW TO USE: ./hearts.sh nginx-install, on the server, adds the relay and resident Medley part
# (between the BEGIN/END hearts-medley markers) to the apps.athenadecisions.com server block.
# Otherwise: paste these location blocks INSIDE the existing
#   server { server_name apps.athenadecisions.com; ... }
# block in /etc/nginx/sites-available/apps.athenadecisions.com, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Containers (docker-compose.server.yml): backend 8050, frontend 3050, relay 8051, the resident
# Medley's screen 8052 (watch) and 8053 (control).
#
# The control screen needs a login file, made once:
#   sudo htpasswd -c /etc/nginx/hearts-medley.htpasswd harley     (apache2-utils)

    # Health probe.
    location = /hearts/health {
        proxy_pass http://127.0.0.1:8050/health;
        proxy_set_header Host $host;
    }

    # REST API and WebSockets -> backend. ^~ so it wins over the SPA prefix. Trailing /api/ on
    # proxy_pass strips the /hearts prefix: /hearts/api/... -> :8050/api/...
    location ^~ /hearts/api/ {
        proxy_pass http://127.0.0.1:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A game's socket stays open between moves, however long a person takes.
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # BEGIN hearts-medley: the relay and the resident Medley (./hearts.sh nginx-install puts
    # this part into the server block, between these markers, and replaces it on later runs).

    # The network game's relay.  A Medley connects with
    #   (HNET.Connect "athena" "NAME" "wss://apps.athenadecisions.com/hearts")
    # and its link asks for /hearts/hnet/ROOM?name=NAME, which reaches the relay as /hnet/ROOM.
    location ^~ /hearts/hnet/ {
        proxy_pass http://127.0.0.1:8051/hnet/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # The resident Medley's screen, to watch: view only, open to all.
    #   https://apps.athenadecisions.com/hearts/medley/watch/
    location = /hearts/medley/watch/ {
        return 302 /hearts/medley/watch/vnc.html?path=hearts/medley/watch/websockify&autoconnect=1&view_only=1&resize=scale&reconnect=1;
    }
    location ^~ /hearts/medley/watch/ {
        proxy_pass http://127.0.0.1:8052/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # ... and to control: keyboard and mouse, behind a login.  Whoever logs in has a Lisp that can
    # run shell commands in the container, so give the login only to people you trust.
    #   https://apps.athenadecisions.com/hearts/medley/control/
    location = /hearts/medley/control/ {
        auth_basic "HEARTS Medley";
        auth_basic_user_file /etc/nginx/hearts-medley.htpasswd;
        return 302 /hearts/medley/control/vnc.html?path=hearts/medley/control/websockify&autoconnect=1&resize=scale&reconnect=1;
    }
    location ^~ /hearts/medley/control/ {
        auth_basic "HEARTS Medley";
        auth_basic_user_file /etc/nginx/hearts-medley.htpasswd;
        proxy_pass http://127.0.0.1:8053/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # END hearts-medley

    # Frontend SPA. Trailing slash strips /hearts/ before the container, whose
    # nginx serves the static build and falls back to index.html.
    location ^~ /hearts/ {
        proxy_pass http://127.0.0.1:3050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
