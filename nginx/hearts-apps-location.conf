# HEARTS -- path-based serving under https://apps.athenadecisions.com/hearts
#
# HOW TO USE: paste these location blocks INSIDE the existing
#   server { server_name apps.athenadecisions.com; ... }
# block in /etc/nginx/sites-available/apps.athenadecisions.com, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Containers (docker-compose.server.yml): backend 8050, frontend 3050.

    # Health probe.
    location = /hearts/health {
        proxy_pass http://127.0.0.1:8050/health;
        proxy_set_header Host $host;
    }

    # REST API and WebSockets -> backend. ^~ so it wins over the SPA prefix. Trailing /api/ on
    # proxy_pass strips the /hearts prefix: /hearts/api/... -> :8050/api/...
    location ^~ /hearts/api/ {
        proxy_pass http://127.0.0.1:8050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A game's socket stays open between moves, however long a person takes.
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
    }

    # Frontend SPA. Trailing slash strips /hearts/ before the container, whose
    # nginx serves the static build and falls back to index.html.
    location ^~ /hearts/ {
        proxy_pass http://127.0.0.1:3050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
