server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API to the backend service so the stack is self-contained
    # (no CORS locally), including each table's WebSocket. In the Athena
    # deployment the outer nginx intercepts /hearts/api first, so this block is
    # simply unused there.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A game's socket stays open between moves, however long a person takes.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
