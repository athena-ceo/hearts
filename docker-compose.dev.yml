#
# Local full-stack run for Docker Desktop. Values come from a .env file in this
# directory (copy .env.example to .env). Open http://localhost:3050 -- the
# frontend proxies /api to the backend, including its WebSockets.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8050}:8000"
      - "127.0.0.1:${NETHUB_PORT:-3333}:3333"      # The house's NetHub, for Medleys on this computer.
    environment:
      ENVIRONMENT: development
      HEARTS_DB: /data/db/hearts.db
      HEARTS_ADMIN_PASSWORD: ${HEARTS_ADMIN_PASSWORD:-}
      HEARTS_NETHUB_PORT: "3333"
      HEARTS_OFFER_KEY: ${HEARTS_OFFER_KEY:-}
    volumes:
      - hearts-db:/data/db
    networks:
      - hearts-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3050}:80"
    depends_on:
      - backend
    networks:
      - hearts-network

volumes:
  hearts-db:

networks:
  hearts-network:
    driver: bridge
