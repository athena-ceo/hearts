[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearts"
version = "0.1.0"
description = "HEARTS in Python: the 1986 expert system's game, its players, and a server for invited players."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["hearts*", "rulebook*"]

[tool.setuptools.package-data]
hearts = ["players/data/*", "players/expert/*.rules", "players/expert/variants/*.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
